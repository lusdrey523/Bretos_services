name: Breto's Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security-gate:
    name: security-gate / static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify Node runtime
        run: node --version
      - name: Run fail-closed security checks
        run: node scripts/security-gate.mjs
      - name: Upload sanitized security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bretos-security-gate-${{ github.sha }}
          path: security-reports/security-gate.json
          if-no-files-found: warn
          retention-days: 30

  runtime-evidence-required:
    name: security-gate / runtime-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require explicit runtime target
        env:
          SECURITY_GATE_BASE_URL: ${{ vars.SECURITY_GATE_BASE_URL }}
        run: |
          if [ -z "$SECURITY_GATE_BASE_URL" ]; then
            echo "::error::Missing repository variable SECURITY_GATE_BASE_URL. Runtime evidence is mandatory."
            exit 1
          fi
          node -e 'const u=new URL(process.env.SECURITY_GATE_BASE_URL); if(u.protocol!=="https:" || ["localhost","127.0.0.1"].includes(u.hostname) || u.username || u.password || u.search || u.hash) process.exit(1); console.log("Explicit HTTPS target configured.")'
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run non-destructive runtime checks
        env:
          SECURITY_GATE_BASE_URL: ${{ vars.SECURITY_GATE_BASE_URL }}
        run: node scripts/runtime-smoke.mjs
